<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miora – menopause support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2fb;--card:#fff;--ink:#35274a;--mute:#7b6d90;--line:#e6ddf0;--lav:#9a82d4;--lavs:#ece5f8;--sage:#6fb39b;--sages:#e1f1ea;--rose:#e58aa3;--roses:#fbe6ec;--peach:#f2a977;--peachs:#fcebdd;--r:20px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1427;--card:#271e37;--ink:#f0eaf8;--mute:#a699bb;--line:#3a2f4e;--lavs:#352b4f;--sages:#223a33;--roses:#43263a;--peachs:#473327}}
:root[data-theme="dark"]{--bg:#1b1427;--card:#271e37;--ink:#f0eaf8;--mute:#a699bb;--line:#3a2f4e;--lavs:#352b4f;--sages:#223a33;--roses:#43263a;--peachs:#473327}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Nunito,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:700;line-height:1.2}
h1{font-size:1.9rem}h2{font-size:1.25rem;margin-bottom:10px}h3{font-size:1.05rem}
main{max-width:980px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font:700 1.5rem Fraunces,serif;letter-spacing:.02em;background:linear-gradient(90deg,var(--lav),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.grid .card{margin:0}
.hero{background:linear-gradient(135deg,var(--lavs),var(--roses));border:0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute);font-size:.9rem}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:9px 16px;background:var(--lav);color:#fff;font-weight:700}
button.g{background:var(--lavs);color:var(--ink)}button.on{background:var(--sage);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{background:var(--lavs);color:var(--ink);font-weight:600}.chips button.on{background:var(--lav);color:#fff}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{padding:0;accent-color:var(--lav)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;color:var(--mute);font-size:.66rem;padding:6px 3px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}nav button.on{color:var(--lav);background:var(--lavs)}
@media(min-width:900px){body{padding:0 0 0 190px}nav{top:0;right:auto;bottom:auto;width:190px;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 12px;border-top:0;border-right:1px solid var(--line)}nav button{flex-direction:row;font-size:.95rem;gap:10px;padding:10px 14px;width:100%}}
.stat{font:700 2rem Fraunces,serif}.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--sages);color:var(--sage)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.row+.row{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--lav);background:none;padding:0;color:#fff;font-size:15px}.chk.on{background:var(--sage);border-color:var(--sage)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.b{max-width:85%;padding:10px 14px;border-radius:18px;background:var(--lavs)}.b.me{align-self:flex-end;background:var(--lav);color:#fff}
.b small{display:block;color:var(--mute);margin-top:4px}
svg text{fill:var(--mute);font:11px Nunito,sans-serif}
.pulse{animation:p 1.6s infinite}@keyframes p{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.sm{font-size:.8rem}.tabs{display:flex;gap:8px;margin-bottom:14px}
#lg{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,var(--lavs),var(--bg) 55%,var(--roses));display:grid;place-items:center;padding:20px;overflow:auto}
#lg .bgi{position:absolute;inset:0;width:100%;height:100%;opacity:.13;pointer-events:none}
#lg .box{position:relative;width:100%;max-width:380px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:28px;padding:28px 24px;backdrop-filter:blur(6px)}
#lg .box label{display:block;margin-top:12px;font-weight:600}#lg .box button{width:100%;margin-top:16px}
@media print{#lg{display:none}nav,header,.noprint{display:none}body{padding:0}}
</style>
</head>
<body>
<div id="lg" role="dialog" aria-label="Demo sign in"><svg class="bgi" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="460" cy="120" r="58" fill="#f2a977"/><circle cx="485" cy="108" r="52" fill="var(--bg)"/><g transform="translate(300 430)" fill="#e58aa3"><ellipse rx="30" ry="96" cy="-78" transform="rotate(-52)" fill-opacity=".7"/><ellipse rx="30" ry="96" cy="-78" transform="rotate(52)" fill-opacity=".7"/><ellipse rx="30" ry="100" cy="-82" transform="rotate(-26)"/><ellipse rx="30" ry="100" cy="-82" transform="rotate(26)"/><ellipse rx="32" ry="108" cy="-88" fill="#f2a977"/></g><g fill="none" stroke="#9a82d4" stroke-width="3"><path d="M0 470 Q75 440 150 470 T300 470 T450 470 T600 470"/><path d="M0 505 Q75 475 150 505 T300 505 T450 505 T600 505" opacity=".7"/><path d="M0 540 Q75 510 150 540 T300 540 T450 540 T600 540" opacity=".45"/></g></svg>
<div class="box"><div class="brand" style="font-size:2.2rem">Miora</div><p class="mute" style="margin:4px 0 8px">A calm, private place for your menopause journey.</p>
<label>Email<input id="le" type="email" autocomplete="off" placeholder="meera@example.com"></label>
<label>Password<input id="lp" type="password" autocomplete="off" placeholder="Anything works in this demo" onkeydown="if(event.key=='Enter')enter()"></label>
<button onclick="enter()">Enter Miora</button><button class="g" onclick="enter(1)">Continue as guest</button>
<p class="mute sm" style="margin:14px 0 0;text-align:center">Demo sign-in only. No account is created and nothing is checked.</p></div></div>
<main>
<header><div><div class="brand">Miora</div><div class="mute sm">Calm, private tracking for your menopause journey</div></div><div class="chips"><button class="g" onclick="theme()" aria-label="Switch light or dark theme">Theme</button><button class="g" onclick="$('#lg').style.display='grid'">Sign out</button></div></header>
<div id="v"></div>
</main>
<nav id="nav" aria-label="Main"></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const D=[];for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*864e5);D.push({d:d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}),hf:Math.max(0,Math.round(3.6+rnd()*3-(29-i)*.07)),sl:Math.round((5.1+(29-i)*.03+rnd()*1.7)*10)/10,mo:Math.round(2.3+rnd()*2.4),ns:rnd()>.55?1:0})}
const H=Array.from({length:24},(_,h)=>Math.round((h>=1&&h<=4?6:h>=14&&h<=17?4:1)*(.5+rnd())));
const SYM=["Hot flash","Night sweats","Poor sleep","Low mood","Anxiety","Brain fog","Joint aches","Fatigue"];
const SF=[18,11,15,9,8,10,7,13];
let S={mood:0,ck:[0,0,0],logs:[],tab:"today",seg:"c",sl:2,lv:[
{n:"Rishik",r:"Son",c:"#9a82d4",s:1},{n:"Vaishnavi",r:"Daughter",c:"#e58aa3",s:1},{n:"Dr. Alam",r:"Clinician",c:"#6fb39b",s:0},{n:"Aditya",r:"Husband",c:"#f2a977",s:1}],
posts:[{u:"QuietRiver",t:"Night sweats were the hardest part for me. A cotton sheet set and a fan by the bed helped a little. What worked for you?",l:14,c:6},{u:"MorningLotus",t:"Wrote my symptoms for three weeks before seeing my doctor. The appointment felt so different with a record in hand.",l:31,c:9},{u:"SoftMonsoon",t:"Anyone else find evening walks calm the racing mind? Even 15 minutes counts.",l:22,c:4}],
chat:[{m:0,t:"Hi, I am Miora, your companion. I can listen, spot patterns in your log and share gentle, explained ideas. I never diagnose. How are you feeling today?"}],
bd:{on:0,t:34.1,h:48,g:2.1,b:86,hist:[],ev:[]},sh:null,hid:{}};
try{const x=JSON.parse(localStorage.getItem("miora")||"null");if(x){S.mood=x.mood||0;S.ck=x.ck||S.ck;S.logs=x.logs||[];S.lv=x.lv||S.lv}}catch(e){}
const save=()=>{try{localStorage.setItem("miora",JSON.stringify({mood:S.mood,ck:S.ck,logs:S.logs,lv:S.lv}))}catch(e){}};
const IC={focus:"M12 3a6 6 0 00-4 10.5V17h8v-3.5A6 6 0 0012 3zm-3 17h6",today:"M12 3v2m0 14v2M3 12h2m14 0h2M6 6l1.4 1.4m9.2 9.2L18 18M6 18l1.4-1.4m9.2-9.2L18 6M12 8a4 4 0 100 8 4 4 0 000-8z",ins:"M4 20V10m6 10V4m6 16v-7m4 7H2",band:"M8 3h8l1 5H7l1-5zm-1 5h10v8H7V8zm1 8h8l-1 5H9l-1-5z",chat:"M4 5h16v11H9l-5 4V5z",com:"M8 11a3 3 0 100-6 3 3 0 000 6zm8 0a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 6-5s6 2 6 5m0 0c0-2 2-4 4-4s4 2 4 4",care:"M12 21s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 6-8 11-8 11z"};
const TABS=[["today","Today"],["ins","Insights"],["focus","Focus"],["band","Band"],["chat","Ask Miora"],["com","Community"],["care","Care"]];
function nav(){$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')" aria-label="${n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>${n}</button>`).join("")}
function go(t){S.tab=t;nav();render();scrollTo(0,0)}
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#1b1427";r.dataset.theme=d?"light":"dark";render()}
/* charts */
function line(a,c,h=150,w=600,lab){const mx=Math.max(...a,1),mn=Math.min(...a,0),x=i=>20+i*(w-30)/(a.length-1),y=v=>h-18-(v-mn)/(mx-mn||1)*(h-36),p=a.map((v,i)=>x(i)+","+y(v)).join(" ");
return`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${lab}"><defs><linearGradient id="g${c.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon points="${x(0)},${h-18} ${p} ${x(a.length-1)},${h-18}" fill="url(#g${c.slice(1)})"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="2" y="${y(mx)+4}">${mx}</text><text x="2" y="${y(mn)+4}">${mn}</text>${a.length>12?`<text x="20" y="${h-2}">${D[0].d}</text><text x="${w-60}" y="${h-2}">${D[29].d}</text>`:""}</svg>`}
function bars(l,v,c,h=190){const m=Math.max(...v),w=600,bw=w/l.length;return`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Symptom frequency">${l.map((n,i)=>{const bh=v[i]/m*(h-50);return`<rect x="${i*bw+8}" y="${h-28-bh}" width="${bw-16}" height="${bh}" rx="8" fill="${c[i%c.length]}"/><text x="${i*bw+bw/2}" y="${h-28-bh-5}" text-anchor="middle">${v[i]}</text><text x="${i*bw+bw/2}" y="${h-10}" text-anchor="middle">${n.split(" ")[0]}</text>`}).join("")}</svg>`}
function heat(v){const m=Math.max(...v);return`<svg viewBox="0 0 600 70" width="100%" role="img" aria-label="Hot flash time of day">${v.map((n,i)=>`<rect x="${i*25}" y="4" width="22" height="38" rx="6" fill="#e58aa3" opacity="${.12+.88*n/m}"/>`).join("")}<text x="0" y="62">12a</text><text x="150" y="62">6a</text><text x="300" y="62">12p</text><text x="450" y="62">6p</text><text x="570" y="62">11p</text></svg>`}
function ring(p){const r=44,c=2*Math.PI*r;return`<svg viewBox="0 0 110 110" width="110" role="img" aria-label="${Math.round(p*100)} percent of daily checklist done"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--card)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--sage)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" style="font:700 20px Fraunces,serif;fill:var(--ink)">${Math.round(p*100)}%</text></svg>`}
const avg=a=>a.reduce((s,v)=>s+v,0)/a.length,f1=n=>(Math.round(n*10)/10);
/* actions */
function logSym(s,sev,src){S.logs.unshift({s,sev,src:src||"You",t:new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})});if(s=="Hot flash")D[29].hf++;if(s=="Night sweats")D[29].ns=1;S.ck[1]=1;save()}
function mood(i){S.mood=i;S.ck[0]=1;D[29].mo=i;save();render()}
function addLog(){const s=SYM[$("#ss").value];logSym(s,+$("#sv").value);render()}
function ck(i){S.ck[i]=S.ck[i]?0:1;save();render()}
/* views */
const V={};
V.today=()=>{const p=S.ck.filter(Boolean).length/3,M=["Low","Tired","Okay","Good","Bright"];
return`<section class="card hero"><div>${ring(p)}</div><div style="flex:1;min-width:220px"><h1>Hello${S.name?", "+E(S.name):""}, you are doing well</h1><p class="mute" style="margin:6px 0 0">Small check-ins build a record that is yours. Go gently today.</p></div></section>
${fcCard(0)}<div class="grid"><section class="card"><h2>Daily checklist</h2>${["Check in with your mood","Log any symptoms","Take two quiet minutes"].map((t,i)=>`<div class="row"><span>${t}</span><button class="chk ${S.ck[i]?"on":""}" onclick="ck(${i})" aria-pressed="${!!S.ck[i]}" aria-label="${t}">${S.ck[i]?"✓":""}</button></div>`).join("")}</section>
<section class="card"><h2>How is your mood?</h2><div class="chips">${M.map((m,i)=>`<button class="${S.mood==i+1?"on":""}" onclick="mood(${i+1})">${m}</button>`).join("")}</div><p class="mute sm" style="margin-top:12px">Mood adds to your trends in Insights.</p></section></div>
<section class="card" style="margin-top:14px"><h2>Log a symptom</h2><div class="grid" style="grid-template-columns:1fr 1fr"><label>Symptom<select id="ss">${SYM.map((s,i)=>`<option value="${i}">${s}</option>`).join("")}</select></label><label>Severity: <b id="sw">2</b> of 5<input id="sv" type="range" min="1" max="5" value="2" oninput="$('#sw').textContent=this.value"></label></div><p><button onclick="addLog()">Save to my log</button> <button class="g" onclick="logSym('Hot flash',2);render()">Quick hot flash</button></p>
${S.logs.length?S.logs.slice(0,5).map(l=>`<div class="row"><div><b>${l.s}</b> <span class="mute sm">severity ${l.sev}</span></div><span class="mute sm">${l.src} · ${l.t}</span></div>`).join(""):'<p class="mute">No logs yet today. Tap Quick hot flash when one happens.</p>'}</section>
<section class="card" style="background:var(--sages);border:0"><h3>A gentle idea for tonight</h3><p style="margin:6px 0">Keep a glass of cool water by the bed and wear breathable cotton layers.</p><p class="mute sm" style="margin:0"><b>Why this?</b> Your log shows more hot flashes between 1 am and 4 am. Source: NHS menopause symptoms guidance. This is a wellbeing idea, not medical advice.</p></section>`};
V.ins=()=>{const w=D.slice(-7),pw=D.slice(-14,-7),hf=w.reduce((s,d)=>s+d.hf,0),ph=pw.reduce((s,d)=>s+d.hf,0),dl=hf-ph,
lo=D.filter(d=>d.sl<6),hi=D.filter(d=>d.sl>=6),a=x=>x.length?f1(avg(x.map(d=>d.hf))):0;
return`<h1 style="margin-bottom:12px">Your patterns</h1>${fcCard(1)}<div class="grid" style="margin-bottom:14px">
<div class="card" style="background:var(--roses);border:0"><div class="mute">Hot flashes, last 7 days</div><div class="stat">${hf}</div><span class="tag">${dl<=0?"down "+-dl:"up "+dl} from last week</span></div>
<div class="card" style="background:var(--lavs);border:0"><div class="mute">Average sleep</div><div class="stat">${f1(avg(w.map(d=>d.sl)))} h</div><span class="mute sm">7-day average</span></div>
<div class="card" style="background:var(--sages);border:0"><div class="mute">Average mood</div><div class="stat">${f1(avg(w.map(d=>d.mo)))} / 5</div><span class="mute sm">higher is brighter</span></div>
<div class="card" style="background:var(--peachs);border:0"><div class="mute">Night sweat nights</div><div class="stat">${w.reduce((s,d)=>s+d.ns,0)} / 7</div><span class="mute sm">this week</span></div></div>
<section class="card"><h2>Hot flashes per day, 30 days</h2>${line(D.map(d=>d.hf),"#e58aa3",160,600,"Hot flashes per day")}</section>
<div class="grid"><section class="card"><h2>Sleep hours</h2>${line(D.map(d=>d.sl),"#9a82d4",140,600,"Sleep hours")}</section><section class="card"><h2>Mood score</h2>${line(D.map(d=>d.mo),"#6fb39b",140,600,"Mood score")}</section></div>
<section class="card" style="margin-top:14px"><h2>Most reported symptoms</h2>${bars(SYM,SF,["#9a82d4","#e58aa3","#6fb39b","#f2a977"])}</section>
<section class="card"><h2>When hot flashes happen</h2>${heat(H)}<p class="mute sm">Darker blocks mean more events in that hour.</p></section>
<section class="card" style="background:var(--lavs);border:0"><h3>What your record suggests</h3><p style="margin:6px 0">On days with under 6 hours of sleep you logged ${a(lo)} hot flashes on average, compared with ${a(hi)} on better-sleep days.</p><p class="mute sm" style="margin:0">Miora describes patterns in what you report. It cannot say what causes them. Share this with your clinician.</p></section>`};
V.band=()=>{const b=S.bd;return`<h1 style="margin-bottom:12px">Miora Band</h1>
<section class="card hero"><div style="flex:1;min-width:220px"><h2>${b.on?'<span class="pulse" style="color:var(--sage)">●</span> Connected over Bluetooth':"Not connected"}</h2><p class="mute" style="margin:0">A passive, lightweight wearable that notices heat spikes and night sweats while you rest. Battery ${b.b}%.</p></div><button class="${b.on?"g":""}" onclick="band()">${b.on?"Disconnect":"Connect band (demo)"}</button></section>
${b.on?`<div class="grid" style="margin-bottom:14px"><div class="card"><div class="mute">Skin temperature</div><div class="stat" id="bt">${f1(b.t)}°C</div></div><div class="card"><div class="mute">Humidity</div><div class="stat" id="bh">${Math.round(b.h)}%</div></div><div class="card"><div class="mute">Sweat (GSR)</div><div class="stat" id="bg">${f1(b.g)} µS</div></div></div>
<section class="card"><h2>Live temperature</h2><div id="bc">${line(b.hist.length>2?b.hist:[34,34,34],"#f2a977",130,600,"Live skin temperature")}</div><p class="mute sm">A sudden rise logs a possible hot flash automatically. <button class="g" onclick="spike()">Simulate a heat spike</button></p></section>`:'<section class="card"><p class="mute">Connect to see live readings. This demo simulates the band; no real device is paired.</p></section>'}
<section class="card"><h2>What the sensors do</h2>${[["MLX90614 infrared","Non-contact skin temperature spikes"],["GSR sweat sensor","Confirms night sweats"],["SHT30","Humidity around the skin"],["ESP32","Low-power Bluetooth brain"]].map(x=>`<div class="row"><b>${x[0]}</b><span class="mute sm" style="text-align:right">${x[1]}</span></div>`).join("")}</section>
${b.ev.length?`<section class="card"><h2>Detected by band</h2>${b.ev.map(e=>`<div class="row"><span>${e}</span><span class="tag">logged</span></div>`).join("")}</section>`:""}`};
let bt;function band(){const b=S.bd;b.on=!b.on;clearInterval(bt);if(b.on)bt=setInterval(tick,1500);render()}
function tick(){const b=S.bd;b.t=Math.max(33.2,Math.min(37.5,b.t+(rnd()-.55)*.25));b.h=Math.max(40,Math.min(85,b.h+(rnd()-.5)*3));b.g=Math.max(1,b.g+(rnd()-.5)*.4);b.hist=[...b.hist.slice(-29),b.t];if(b.t>35.8&&!b.fl){b.fl=1;found()}if(b.t<35)b.fl=0;
if(S.tab=="band"&&$("#bt")){$("#bt").textContent=f1(b.t)+"°C";$("#bh").textContent=Math.round(b.h)+"%";$("#bg").textContent=f1(b.g)+" µS";$("#bc").innerHTML=line(b.hist,"#f2a977",130,600,"Live skin temperature")}}
function spike(){S.bd.t=36.4;S.bd.g+=3;tick()}
function found(){logSym("Hot flash",3,"Band");S.bd.ev.unshift("Possible hot flash at "+S.logs[0].t);S.lv.filter(l=>l.s).forEach(l=>l.note=1);if(S.tab=="band")render()}
const KB=[[/hot flash|flush|heat/,"Hot flashes are common and vary a lot. Cool layers, a fan and slow breathing can take the edge off. Your log shows when they cluster, which is useful to share with a clinician.","NHS: symptoms of menopause"],[/sleep|night|sweat|insomnia/,"Broken sleep often travels with night sweats. A cooler room, light cotton bedding and a steady wind-down routine are gentle places to start. Note your sleep hours here so patterns show up.","NHS: symptoms of menopause"],[/mood|anx|sad|low|cry|worr|stress/,"Mood changes and worry are a recognised part of the transition, and you are not weak for feeling them. A short walk, a call with someone you trust and writing it down can help. If it feels heavy, please speak with a clinician or someone close to you.","NICE NG23"],[/doctor|clinic|appoint|gp|report/,"Open Care and create a clinician summary. It turns your last 30 days into one page you can print or share by a link that expires.","Miora Care"],[/diagnos|cure|medic|dose|hrt|tablet/,"I cannot diagnose, prescribe or give doses. Treatment choices, including HRT, are made with a clinician. I can help you prepare your questions and your record.","NICE NG23"],[/fog|memory|forget|focus/,"Brain fog is commonly reported. Short lists, regular sleep and gentle movement can help. Keep logging it so you can show how often it happens.","NHS: symptoms of menopause"],[/hi\b|hello|hey|thanks/,"I am glad you are here. Tell me what today feels like, or ask about sleep, hot flashes, mood or getting ready for an appointment.","Miora"]];
function ask(q){q=(q||$("#ci").value).trim();if(!q)return;S.chat.push({m:1,t:q});const l=q.toLowerCase(),k=KB.find(x=>x[0].test(l))||[0,"Thank you for telling me. I may not have a specific answer, but I can look at your log with you. Try asking about hot flashes, sleep, mood or preparing for a visit.","Miora"];render();setTimeout(()=>{S.chat.push({m:0,t:k[1],w:k[2]});render()},700)}
V.chat=()=>`<h1 style="margin-bottom:12px">Ask Miora</h1><section class="card"><div class="chat" id="cl" aria-live="polite">${S.chat.map(c=>`<div class="b ${c.m?"me":""}">${E(c.t)}${c.w?`<small>Why this? Source: ${c.w}</small>`:""}</div>`).join("")}</div>
<div class="chips" style="margin:10px 0">${["Why do I get hot flashes?","Help me sleep better","I feel anxious","Prepare for my doctor"].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join("")}</div>
<div class="row" style="border:0;margin:0;padding:0"><input id="ci" placeholder="Type a message" aria-label="Message" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Send</button></div><p class="mute sm">Miora shares general information and never diagnoses.</p></section>`;
V.com=()=>`<h1 style="margin-bottom:12px">Community</h1><div class="tabs"><button class="${S.seg=="c"?"":"g"}" onclick="S.seg='c';render()">The Circle</button><button class="${S.seg=="l"?"":"g"}" onclick="S.seg='l';render()">Loved ones</button></div>${S.seg=="c"?cir():lov()}`;
const cir=()=>`<section class="card"><textarea id="pt" rows="2" maxlength="280" placeholder="Share something kind or ask a question. You appear under a gentle nickname."></textarea><p class="row" style="border:0;margin:0"><span class="mute sm">Moderated and anonymous. Be kind.</span><button onclick="post()">Post</button></p></section>${S.posts.map((p,i)=>S.hid[i]?"":`<section class="card"><div class="row" style="border:0;margin:0;padding:0;justify-content:flex-start"><div class="av" style="background:${["#9a82d4","#e58aa3","#6fb39b"][i%3]}">${E(p.u[0])}</div><b>${E(p.u)}</b></div><p>${E(p.t)}</p><div class="chips"><button class="g" onclick="S.posts[${i}].l++;render()">Support ${p.l}</button><button class="g" onclick="S.posts[${i}].c++;render()">Reply ${p.c}</button><button class="g" onclick="S.hid[${i}]=1;render()">Report</button></div></section>`).join("")}`;
let pc=0;function post(){const t=$("#pt").value.trim();if(!t)return;if(++pc>10)return alert("You can post up to 10 times an hour. Please take a breather.");const n=["GentleDawn","WarmChai","CalmBanyan","SilverJasmine"];S.posts.unshift({u:n[pc%4],t,l:0,c:0});S.hid={};render()}
const lov=()=>`<section class="card"><h2>Your support circle</h2><p class="mute">The people you choose are told when the band or your log notes a hard moment, so you do not carry it alone.</p>${S.lv.map((l,i)=>`<div class="row"><div class="row" style="border:0;margin:0;padding:0"><div class="av" style="background:${l.c}">${l.n[0]}</div><div><b>${E(l.n)}</b><div class="mute sm">${E(l.r)} · ${l.s?"Gets alerts":"Alerts paused"}${l.note?" · notified of your last hot flash":""}</div></div></div><button class="${l.s?"on":"g"}" onclick="S.lv[${i}].s^=1;save();render()">${l.s?"On":"Off"}</button></div>`).join("")}
<div class="row" style="align-items:stretch"><input id="ln" placeholder="Add a name"><button onclick="addL()">Add</button></div></section><section class="card" style="background:var(--roses);border:0"><h3>Send a message</h3><p style="margin:6px 0">Let them know how you are today.</p><div class="chips">${["I am having a rough day","I slept badly","I am feeling good today"].map(m=>`<button onclick="sendL('${m}')">${m}</button>`).join("")}</div><p id="sn" class="mute sm" role="status"></p></section>`;
function addL(){const n=$("#ln").value.trim();if(!n)return;S.lv.push({n,r:"Friend",c:"#9a82d4",s:1});save();render()}
function sendL(m){const n=S.lv.filter(l=>l.s).length;$("#sn").textContent="Sent “"+m+"” to "+n+" people (demo)."}
V.care=()=>{const w=D,t=w.reduce((s,d)=>s+d.hf,0);return`<h1 style="margin-bottom:12px">Care</h1><section class="card" id="sum"><h2>Clinician summary, last 30 days</h2><div class="grid" style="margin-bottom:12px"><div><div class="stat">${t}</div><div class="mute sm">hot flashes logged</div></div><div><div class="stat">${f1(avg(w.map(d=>d.sl)))} h</div><div class="mute sm">average sleep</div></div><div><div class="stat">${w.reduce((s,d)=>s+d.ns,0)}</div><div class="mute sm">night sweat nights</div></div></div>${line(w.map(d=>d.hf),"#e58aa3",120,600,"Hot flashes per day")}<p class="mute sm">Most reported: ${SYM.slice(0,3).join(", ")}. Self-reported by the user. Miora does not diagnose.</p></section>
${kitC()}<section class="card noprint"><h2>Share securely</h2><div class="row" style="border:0;margin:0;padding:0"><select id="ex" style="max-width:180px"><option>Expires in 24 hours</option><option>Expires in 7 days</option></select><button onclick="share()">Create link (demo)</button><button class="g" onclick="print()">Print</button></div>${S.sh?`<p class="row"><code style="word-break:break-all">${S.sh}</code><button class="g" onclick="S.sh=null;render()">Revoke</button></p>`:'<p class="mute sm">Links are random, expire and can be revoked any time.</p>'}</section>
<section class="card noprint"><h2>Library</h2>${[["Symptoms of menopause and perimenopause","NHS","Symptoms vary widely and can start years before periods stop."],["Menopause: identification and management (NG23)","NICE","Clinical guideline for healthcare professionals."]].map(x=>`<div class="row"><div><b>${x[0]}</b><div class="mute sm">${x[2]}</div></div><span class="tag">${x[1]}</span></div>`).join("")}</section>
<section class="card noprint"><h2>Your data, your control</h2><p class="mute">Private by default. No account is needed in this version; data stays on this device.</p><div class="chips"><button class="g" onclick="exp()">Copy my data</button><button class="g" onclick="if(confirm('Delete all your logs?')){S.logs=[];S.ck=[0,0,0];S.mood=0;save();render()}">Delete my data</button></div></section>`};
function share(){S.sh="miora.app/s/"+Array.from({length:14},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(rnd()*31)]).join("");render()}
function exp(){try{navigator.clipboard.writeText(JSON.stringify({days:D,logs:S.logs},null,1));alert("Copied to your clipboard.")}catch(e){alert("Copy was blocked by your browser.")}}
/* brain fog optimizer */
const FG=D.map(d=>Math.round(Math.max(15,Math.min(90,60-d.sl*3+d.hf*4+rnd()*15-8))));let FOG=FG[29];S.g={ph:"i"};
const cl=h=>{let v=55+40*Math.exp(-((h-10)**2)/6)-25*Math.exp(-((h-15)**2)/4);if(FOG>40)v-=(FOG-40)*.6;return Math.max(5,Math.min(100,Math.round(v)))},f12=h=>(h%12||12)+(h<12?" am":" pm");
function win(){let b=7,w=7;for(let h=7;h<=19;h++){if(cl(h)+cl(h+1)>cl(b)+cl(b+1))b=h;if(cl(h)+cl(h+1)<cl(w)+cl(w+1))w=h}return[b,w]}
const clr=()=>{const[b,w]=win();return`<svg viewBox="0 0 600 130" width="100%" role="img" aria-label="Predicted clarity by hour">${Array.from({length:16},(_,i)=>{const h=i+6,bh=cl(h)*.9,c=h==b||h==b+1?"#9a82d4":h==w||h==w+1?"#e58aa3":"#6fb39b";return`<rect x="${i*37+4}" y="${100-bh}" width="30" height="${bh}" rx="7" fill="${c}"/><text x="${i*37+19}" y="118" text-anchor="middle">${h%12||12}</text>`}).join("")}</svg>`};
function gS(){S.g={ph:"s",r:0,sc:0,n:""};gN()}
function gN(){const L=[4,5,6][S.g.r];S.g.n=Array.from({length:L},()=>Math.floor(Math.random()*10)).join("");S.g.ph="s";render();setTimeout(()=>{S.g.ph="a";render();const a=$("#ga");if(a)a.focus()},1800)}
function gC(){if($("#ga").value.trim()==S.g.n)S.g.sc++;if(++S.g.r<3)gN();else{FOG=Math.round(90-S.g.sc*27);FG[29]=FOG;S.g.ph="d";render()}}
V.focus=()=>{const g=S.g,hi=FOG>=55,[b,w]=win();let box;
if(g.ph=="s")box=`<div class="stat" style="font-size:3rem;letter-spacing:.3em;text-align:center">${g.n}</div><p class="mute" style="text-align:center">Round ${g.r+1} of 3. Hold it in mind.</p>`;
else if(g.ph=="a")box=`<p>What was the number?</p><div class="row" style="border:0;margin:0;padding:0"><input id="ga" inputmode="numeric" autocomplete="off" aria-label="Your answer" onkeydown="if(event.key=='Enter')gC()"><button onclick="gC()">Check</button></div>`;
else box=`<p>${g.ph=="d"?"You remembered "+g.sc+" of 3. Today’s fog level: <b>"+FOG+"</b> out of 100.":"Three quick rounds, about 30 seconds. Nothing here is a test of your worth."}</p><button onclick="gS()">${g.ph=="d"?"Check again":"Start 30-second check"}</button>`;
return`<h1 style="margin-bottom:12px">Focus</h1><section class="card hero"><div style="flex:1;min-width:240px"><h2>Brain fog check</h2>${box}</div><div style="text-align:center"><div class="stat">${FOG}</div><span class="tag" style="background:var(--card);color:${hi?"var(--rose)":"var(--sage)"}">${hi?"Fog is high":FOG>=40?"Mild fog":"Clear"}</span></div></section>
<section class="card"><h2>Fog trend, 30 days</h2>${line(FG,"#9a82d4",140,600,"Brain fog index")}<p class="mute sm">Lower is clearer. Fog tends to rise after short nights.</p></section>
<section class="card"><h2>Predicted clarity today</h2>${clr()}<p class="mute sm"><span style="color:#9a82d4">●</span> best window <span style="color:#e58aa3">●</span> dip <span style="color:#6fb39b">●</span> steady</p></section>
<section class="card"><h2>Your day, reorganised</h2>${hi?'<p class="tag" style="background:var(--roses);color:var(--rose)">High fog today: one focus block only, breaks every 45 minutes</p>':""}
<div class="row"><div><b>${f12(b)} to ${f12(b+2)}</b><div class="mute sm">Deep focus: writing, planning, numbers</div></div><span class="tag" style="background:var(--lavs);color:var(--lav)">Focus</span></div>
<div class="row"><div><b>${f12(w)} to ${f12(w+2)}</b><div class="mute sm">Shielded: no big decisions or tricky emails. Routine admin or rest</div></div><span class="tag" style="background:var(--roses);color:var(--rose)">Protect</span></div>
<div class="row"><div><b>Everything else</b><div class="mute sm">Calls, errands and replies that need little effort</div></div><span class="tag">Easy</span></div></section>`};
/* predictive flare */
function fc(){const l2=avg(D.slice(-2).map(d=>d.sl)),h3=avg(D.slice(-3).map(d=>d.hf)),hm=avg(D.map(d=>d.hf)),m2=avg(D.slice(-2).map(d=>d.mo)),bt=S.bd.on&&S.bd.t>35.3?1:0,cp=v=>Math.max(5,Math.min(95,Math.round(v)));
const hf=cp(35+(6-l2)*9+(h3-hm)*10+(FOG-50)*.2+bt*12),md=cp(30+(3.5-m2)*14+(6-l2)*6+(FOG-50)*.2),why=[];
if(l2<6)why.push("sleep averaged "+f1(l2)+" h over two nights");if(h3>hm)why.push("recent hot flashes are above your 30-day average");if(FOG>=55)why.push("brain fog is elevated");if(bt)why.push("your band shows skin temperature rising");if(!why.length)why.push("your recent pattern is steady");
return{hf,md,h48:cp(hf+(h3-hm)*3+4),m48:cp(md+3),why,T:v=>v>=65?["High","var(--rose)"]:v>=40?["Moderate","var(--peach)"]:["Low","var(--sage)"]}}
const fcCard=full=>{const f=fc(),t=v=>{const x=f.T(v);return`<span class="tag" style="background:var(--card);color:${x[1]}">${x[0]} · ${v}%</span>`};
return`<section class="card" style="background:linear-gradient(135deg,var(--peachs),var(--lavs));border:0"><h2>Predictive Flare</h2><div class="grid" style="margin-bottom:10px"><div><div class="mute sm">Hot flash, next 24 h</div>${t(f.hf)}</div><div><div class="mute sm">Hot flash, 24 to 48 h</div>${t(f.h48)}</div><div><div class="mute sm">Mood dip, next 24 h</div>${t(f.md)}</div><div><div class="mute sm">Mood dip, 24 to 48 h</div>${t(f.m48)}</div></div>${full?`<div class="mute sm">Hours when hot flashes are most likely</div>${heat(H)}`:""}<p style="margin:6px 0"><b>Prepare:</b> ${f.hf>=40?"keep a cool drink and a light layer close, and plan demanding work for the cooler morning.":"a calm stretch is likely. Keep your usual routine."}</p><p class="mute sm" style="margin:0"><b>Why this?</b> ${f.why.join("; ")}. A personal estimate from your own log, not a medical prediction.</p></section>`};
/* doctor and HR shield */
function kitL(){const t=D.reduce((s,d)=>s+d.hf,0),ns=D.reduce((s,d)=>s+d.ns,0),ls=D.filter(d=>d.sl<6).length,pk=H.indexOf(Math.max(...H)),[b]=win(),f=avg(D.slice(0,15).map(d=>d.hf)),l=avg(D.slice(15).map(d=>d.hf)),sl=f1(avg(D.map(d=>d.sl))),mo=f1(avg(D.map(d=>d.mo))),fg=Math.round(avg(FG)),hv=FG.filter(x=>x>=55).length;
if(S.kit=="m")return[["Medical summary, "+D[0].d+" to "+D[29].d,"Self-reported by the patient using Miora. A record of symptoms, not a diagnosis."],["Hot flashes",t+" logged, about "+f1(t/30)+" a day. "+(l<f?"Frequency is easing":"Frequency is steady or rising")+" (first half "+f1(f)+" a day, second half "+f1(l)+"). Most often around "+f12(pk)+"."],["Night sweats",ns+" of 30 nights."],["Sleep","Average "+sl+" hours; "+ls+" nights under 6 hours."],["Mood and concentration","Mood averages "+mo+" of 5. Brain fog index averages "+fg+" of 100, elevated on "+hv+" days."],["Wearable data",S.bd.ev.length?S.bd.ev.length+" temperature spikes detected this session.":"No wearable events recorded this session."],["Questions for my clinician","What else could explain these symptoms? Which options suit me? What should I keep tracking before my next visit?"]];
return[["Confidential accommodation request (anonymised)","Name and diagnosis are intentionally not included. Prepared by the employee."],["Purpose","A request for temporary, flexible work adjustments for a health-related need."],["Observed impact, last 30 days","Sleep averaged "+sl+" hours, with "+ls+" short nights. Concentration was reduced on "+hv+" of 30 days. Sudden heat episodes averaged "+f1(t/30)+" a day."],["Adjustments requested","Flexible start times; demanding work scheduled around "+f12(b)+" to "+f12(b+2)+"; remote work or a lighter load on high-fog days; a cool, ventilated workspace with a fan; short breaks as needed."],["Review","Reassess in 8 weeks. Shared voluntarily and kept confidential."]]}
const kitC=()=>{const L=S.kit?kitL():0;return`<section class="card"><h2>Doctor &amp; HR Shield</h2><p class="mute">Turn your log into clear, professional documents in one click.</p><div class="chips noprint"><button class="${S.kit=="m"?"on":"g"}" onclick="S.kit='m';render()">Medical summary</button><button class="${S.kit=="h"?"on":"g"}" onclick="S.kit='h';render()">Workplace report</button></div>${L?`<div style="background:var(--bg);border-radius:14px;padding:14px;margin-top:12px">${L.map((x,i)=>i?`<h3>${x[0]}</h3><p style="margin:2px 0 10px">${E(x[1])}</p>`:`<h2>${x[0]}</h2><p class="mute">${E(x[1])}</p>`).join("")}</div><p class="chips noprint"><button onclick="print()">Print or save as PDF</button><button class="g" onclick="cp()">Copy text</button></p>`:""}</section>`};
function cp(){try{navigator.clipboard.writeText(kitL().map(x=>x[0]+"\n"+x[1]).join("\n\n"));alert("Copied.")}catch(e){alert("Copy was blocked by your browser.")}}
function render(){$("#v").innerHTML=V[S.tab]();const c=$("#cl");if(c)c.scrollTop=c.scrollHeight}
function enter(g){const e=$("#le").value.trim();S.name=g||!e?"":e.split("@")[0].replace(/^./,c=>c.toUpperCase());$("#lg").style.display="none";go("today")}
nav();render();
</script>
